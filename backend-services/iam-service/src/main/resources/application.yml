server:
  port: 8084

spring:
  application:
    name: IAM-SERVICE
  security:
    user:
      name: admin
      password: password

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
