server:
  port: 8085

spring:
  application:
    name: APPOINTMENT-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/appointmentdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
