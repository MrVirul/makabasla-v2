syntax = "proto3";

package billing;

option go_package = "github.com/makabas/shared/pkg/pb/billing";

message CreateBillingRequest {
  string id = 1;
  uint32 vehicle_id = 2;
  double expense_cost = 3;
  double advance_income = 4;
  double total_expenses = 5;
  double total_advance = 6;
  double balance = 7;
}

message CreateBillingResponse {
  string id = 1;
}

service BillingService {
  rpc CreateBilling(CreateBillingRequest) returns (CreateBillingResponse);
}
