syntax = "proto3";

package common;

option go_package = "github.com/makabas/shared/pkg/pb/common";

message ErrorResponse {
    int32 code = 1;
    string message = 2;
    string detail = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
    enum Status {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
    }
    Status status = 1;
}
