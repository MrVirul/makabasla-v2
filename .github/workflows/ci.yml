name: CI — Code Quality

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. Validate PR title follows Conventional Commits
  # ──────────────────────────────────────────────
  pr-title-lint:
    name: 🏷️ PR Title Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            api-gateway
            iam-service
            appointment-service
            billing-service
            task-mgt-service
            webstore-service
            frontend
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            PR title subject must not start with an uppercase letter.
            Use imperative mood, e.g. "add feature" not "Add feature".

  # ──────────────────────────────────────────────
  # 2. Validate commit messages
  # ──────────────────────────────────────────────
  commit-lint:
    name: 📝 Commit Message Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install --save-dev @commitlint/{cli,config-conventional}

      - name: Create commitlint config
        run: |
          echo "module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'scope-enum': [1, 'always', [
                'api-gateway',
                'iam-service',
                'appointment-service',
                'billing-service',
                'task-mgt-service',
                'webstore-service',
                'frontend'
              ]],
              'subject-case': [2, 'never', ['start-case', 'pascal-case', 'upper-case']],
              'header-max-length': [2, 'always', 72]
            }
          };" > commitlint.config.js

      - name: Lint commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ──────────────────────────────────────────────
  # 3. Detect which services changed
  # ──────────────────────────────────────────────
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-services/**'
            frontend:
              - 'frontend/**'
            docs:
              - '**/*.md'

  # ──────────────────────────────────────────────
  # 4. Backend quality checks (Java / Spring Boot)
  # ──────────────────────────────────────────────
  backend-quality:
    name: ☕ Backend Quality
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Find and build Maven projects
        run: |
          echo "🔍 Searching for Maven projects in backend-services..."
          found=false
          for pom in $(find backend-services -name "pom.xml" -maxdepth 2); do
            dir=$(dirname "$pom")
            echo "──────────────────────────────────"
            echo "📦 Building: $dir"
            echo "──────────────────────────────────"
            cd "$dir"
            mvn clean verify --batch-mode --no-transfer-progress
            cd "$GITHUB_WORKSPACE"
            found=true
          done
          if [ "$found" = false ]; then
            echo "⚠️ No Maven projects found — skipping backend build."
          fi

      - name: Find and build Gradle projects
        run: |
          echo "🔍 Searching for Gradle projects in backend-services..."
          found=false
          for build_file in $(find backend-services -name "build.gradle" -o -name "build.gradle.kts" -maxdepth 2); do
            dir=$(dirname "$build_file")
            echo "──────────────────────────────────"
            echo "📦 Building: $dir"
            echo "──────────────────────────────────"
            cd "$dir"
            chmod +x gradlew 2>/dev/null || true
            if [ -f "gradlew" ]; then
              ./gradlew clean build --no-daemon
            else
              echo "⚠️ No gradlew found in $dir — skipping."
            fi
            cd "$GITHUB_WORKSPACE"
            found=true
          done
          if [ "$found" = false ]; then
            echo "⚠️ No Gradle projects found — skipping backend build."
          fi

  # ──────────────────────────────────────────────
  # 5. Frontend quality checks
  # ──────────────────────────────────────────────
  frontend-quality:
    name: 🌐 Frontend Quality
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present -- --passWithNoTests

  # ──────────────────────────────────────────────
  # 6. Markdown / documentation lint
  # ──────────────────────────────────────────────
  docs-lint:
    name: 📄 Docs Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
          config: |
            {
              "default": true,
              "MD013": false,
              "MD033": false,
              "MD041": false
            }

  # ──────────────────────────────────────────────
  # 7. Security — scan for leaked secrets
  # ──────────────────────────────────────────────
  secret-scan:
    name: 🔐 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
