services:
  # Keycloak - Identity & Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: makabasla-keycloak
    command: start-dev --http-port 8180 --proxy-headers xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8180"
    networks:
      - makabasla-network
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/8180"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Consul - Service Discovery
  consul:
    image: hashicorp/consul:1.15
    container_name: makabasla-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    networks:
      - makabasla-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # API Gateway
  api-gateway:
    build:
      context: ./backend-services/api-gateway
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-gateway
    ports:
      - "8080:8080"
    networks:
      - makabasla-network
    environment:
      - CONSUL_HOST=${CONSUL_HOST:-consul}
      - PORT=8080
    depends_on:
      consul:
        condition: service_healthy

  # Billing Service
  billing-service:
    build:
      context: ./backend-services
      dockerfile: billing-service/Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-billing-service
    ports:
      - "8083:8083"
    networks:
      - makabasla-network
    environment:
      - DB_URL=${BILLING_DB_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONSUL_HOST=${CONSUL_HOST:-consul}
      - APP_NAME=billing-service
    depends_on:
      consul:
        condition: service_healthy

  # IAM Service
  iam-service:
    build:
      context: ./backend-services/iam-service
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-iam-service
    ports:
      - "8084:8084"
    networks:
      - makabasla-network
    environment:
      - DB_URL=${IAM_DB_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONSUL_HOST=${CONSUL_HOST:-consul}
      - APP_NAME=iam-service
    depends_on:
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy

