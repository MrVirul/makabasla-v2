services:
  # Service Discovery
  consul:
    image: hashicorp/consul:1.15
    container_name: makabasla-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    networks:
      - makabasla-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # API Gateway (Development)
  api-gateway:
    build:
      context: ./backend-services
      dockerfile: Dockerfile.dev
    container_name: makabasla-gateway
    ports:
      - "8080:8080"
    working_dir: /app/api-gateway
    volumes:
      - ./backend-services:/app
    networks:
      - makabasla-network
    environment:
      - CONSUL_HOST=consul
      - PORT=8080
    depends_on:
      consul:
        condition: service_healthy

  # Billing Service (Development)
  billing-service:
    build:
      context: ./backend-services
      dockerfile: Dockerfile.dev
    container_name: makabasla-billing-service
    ports:
      - "8083:8083"
    working_dir: /app/billing-service
    volumes:
      - ./backend-services:/app
    networks:
      - makabasla-network
    environment:
      - DB_URL=${BILLING_DB_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONSUL_HOST=consul
      - APP_NAME=billing-service
    depends_on:
      consul:
        condition: service_healthy

  # Task Management Service (Development)
  task-mgt-service:
    build:
      context: ./backend-services
      dockerfile: Dockerfile.dev
    container_name: makabasla-task-mgt-service
    ports:
      - "8086:8086"
    working_dir: /app/task-mgt-service
    volumes:
      - ./backend-services:/app
    networks:
      - makabasla-network
    environment:
      - DB_URL=${TSKMGT_DB_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONSUL_HOST=consul
      - APP_NAME=task-mgt-service
    depends_on:
      consul:
        condition: service_healthy

  # Appointment Service (Development)
  appointment-service:
    build:
      context: ./backend-services
      dockerfile: Dockerfile.dev
    container_name: makabasla-appointment-service
    ports:
      - "8085:8085"
    working_dir: /app/appointment-service
    volumes:
      - ./backend-services:/app
    networks:
      - makabasla-network
    environment:
      - DB_URL=${APPOINTMENT_DB_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONSUL_HOST=consul
      - APP_NAME=appointment-service
    depends_on:
      consul:
        condition: service_healthy

  # Webstore Service (Development)
  webstore-service:
    build:
      context: ./backend-services
      dockerfile: Dockerfile.dev
    container_name: makabasla-webstore-service
    ports:
      - "8087:8087"
    working_dir: /app/webstore-service
    volumes:
      - ./backend-services:/app
    networks:
      - makabasla-network
    environment:
      - DB_URL=${WEBSTORE_DB_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONSUL_HOST=consul
      - APP_NAME=webstore-service
    depends_on:
      consul:
        condition: service_healthy

  # IAM Service (Development)
  iam-service:
    build:
      context: ./backend-services
      dockerfile: Dockerfile.dev
    container_name: makabasla-iam-service
    ports:
      - "8084:8084"
    working_dir: /app/iam-service
    volumes:
      - ./backend-services:/app
    networks:
      - makabasla-network
    environment:
      - DB_URL=${IAM_DB_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CONSUL_HOST=consul
      - APP_NAME=iam-service
    depends_on:
      consul:
        condition: service_healthy

networks:
  makabasla-network:
    driver: bridge
    name: makabasla-network
