services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: makabasla-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend-services/setup-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - makabasla-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak - Identity & Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: makabasla-keycloak
    command: start-dev --http-port 8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/iamdb
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    networks:
      - makabasla-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8180/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Consul - Service Discovery
  consul:
    image: hashicorp/consul:1.15
    container_name: makabasla-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    networks:
      - makabasla-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # API Gateway
  api-gateway:
    build:
      context: ./backend-services/api-gateway
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-gateway
    ports:
      - "8080:8080"
    networks:
      - makabasla-network
    environment:
      - CONSUL_HOST=consul
      - PORT=8080
    depends_on:
      consul:
        condition: service_healthy

  # Billing Service
  billing-service:
    build:
      context: ./backend-services/billing-service
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-billing-service
    ports:
      - "8083:8083"
    networks:
      - makabasla-network
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/billingdb?sslmode=disable
      - CONSUL_HOST=consul
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # IAM Service
  iam-service:
    build:
      context: ./backend-services/iam-service
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-iam-service
    ports:
      - "8084:8084"
    networks:
      - makabasla-network
    environment:
      - CONSUL_HOST=consul
    depends_on:
      consul:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Appointment Service
  appointment-service:
    build:
      context: ./backend-services/appointment-service
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-appointment-service
    ports:
      - "8085:8085"
    networks:
      - makabasla-network
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/appointmentdb?sslmode=disable
      - CONSUL_HOST=consul
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # Task Management Service
  task-mgt-service:
    build:
      context: ./backend-services/task-mgt-service
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-task-mgt-service
    ports:
      - "8086:8086"
    networks:
      - makabasla-network
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/taskdb?sslmode=disable
      - CONSUL_HOST=consul
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  # Webstore Service
  webstore-service:
    build:
      context: ./backend-services/webstore-service
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.26-alpine
    container_name: makabasla-webstore-service
    ports:
      - "8087:8087"
    networks:
      - makabasla-network
    environment:
      - DB_URL=postgres://postgres:postgres@postgres:5432/webstoredb?sslmode=disable
      - CONSUL_HOST=consul
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

networks:
  makabasla-network:
    driver: bridge
    name: makabasla-network

volumes:
  postgres-data:
    name: makabasla-postgres-data